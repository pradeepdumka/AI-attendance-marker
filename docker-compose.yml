name: ai-attendance

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Root password falls back to MYSQL_PASSWORD so a .env that uses
      # MYSQL_USER=root does not need a second secret.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD:-}}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_attendance}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    entrypoint: ["/bin/bash", "/mysql-entrypoint.sh"]
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-entrypoint.sh:/mysql-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -N -e \"SELECT 1\" >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME:-AI Attendance Marker}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-attendance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_attendance}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.6}
      FACE_EMBEDDING_CACHE_SECONDS: ${FACE_EMBEDDING_CACHE_SECONDS:-60}
      ATTENDANCE_TIMEZONE: ${ATTENDANCE_TIMEZONE:-UTC}
      ATTENDANCE_LATE_AFTER: ${ATTENDANCE_LATE_AFTER:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
