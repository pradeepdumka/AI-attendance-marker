<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AI Attendance Marker</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="login">
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span>Attendance</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/" data-nav="home">Home</a>
      <a href="/login" data-nav="login" aria-current="page" data-guest>Sign in</a>
      <a href="/dashboard" data-nav="dashboard" data-user hidden>Dashboard</a>
      <button type="button" class="text-button" data-logout data-user hidden>Log out</button>
    </nav>
  </header>

  <main id="content" class="auth-main">
    <form class="panel" id="login-form" method="post" action="/auth/login" novalidate>
      <h1>Sign in</h1>
      <p class="lede">Use the email and password for your school account.</p>
      <p class="form-message" id="form-message" hidden></p>
      <label class="field">
        <span>Email</span>
        <input name="email" type="email" autocomplete="username" required maxlength="255">
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required minlength="1" maxlength="128">
      </label>
      <button class="button" type="submit">Sign in</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>AI Attendance Marker</p>
    <nav aria-label="Footer">
      <a href="/">Home</a>
    </nav>
  </footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
