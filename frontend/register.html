<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · AI Attendance Marker</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="register">
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span>Attendance</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/" data-nav="home">Home</a>
      <a href="/login" data-nav="login" data-guest>Sign in</a>
      <a href="/register" data-nav="register" aria-current="page" data-guest>Register</a>
      <a href="/dashboard" data-nav="dashboard" data-user hidden>Dashboard</a>
      <button type="button" class="text-button" data-logout data-user hidden>Log out</button>
    </nav>
  </header>

  <main id="content" class="auth-main">
    <form class="panel" id="register-form" method="post" action="/auth/register" novalidate>
      <h1>Create an account</h1>
      <p class="lede">Students, teachers, and admins can register. An admin manages the roster from the dashboard.</p>
      <p class="form-message" id="form-message" hidden></p>
      <div class="split">
        <label class="field">
          <span>First name</span>
          <input name="first_name" autocomplete="given-name" required maxlength="100">
        </label>
        <label class="field">
          <span>Last name</span>
          <input name="last_name" autocomplete="family-name" required maxlength="100">
        </label>
      </div>
      <label class="field">
        <span>Email</span>
        <input name="email" type="email" autocomplete="email" required maxlength="255">
      </label>
      <label class="field">
        <span>Phone <small>Optional</small></span>
        <input name="phone" type="tel" autocomplete="tel" maxlength="20" inputmode="tel">
      </label>
      <fieldset class="roles">
        <legend>I am a</legend>
        <label><input type="radio" name="role" value="STUDENT" checked> Student</label>
        <label><input type="radio" name="role" value="TEACHER"> Teacher</label>
        <label><input type="radio" name="role" value="ADMIN"> Admin</label>
      </fieldset>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        <small>8 to 128 characters, and not the same as your email.</small>
      </label>
      <button class="button" type="submit">Create account</button>
      <p class="form-foot">Already registered? <a href="/login">Sign in</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>AI Attendance Marker</p>
    <nav aria-label="Footer">
      <a href="/">Home</a>
      <a href="/login" data-guest>Sign in</a>
    </nav>
  </footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
