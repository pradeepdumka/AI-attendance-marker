<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · AI Attendance Marker</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="account">
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <span>Attendance</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="/" data-nav="home">Home</a>
      <a href="/login" data-nav="login" data-guest>Sign in</a>
      <a href="/dashboard" data-nav="dashboard" data-user hidden>Dashboard</a>
      <button type="button" class="text-button" data-logout data-user hidden>Log out</button>
    </nav>
  </header>

  <main id="content" class="auth-main">
    <article class="panel" id="account-card">
      <h1>Your account</h1>
      <p class="form-message" id="form-message">Checking your session…</p>
      <dl class="account" id="account-details" hidden>
        <div><dt>Name</dt><dd id="account-name"></dd></div>
        <div><dt>Email</dt><dd id="account-email"></dd></div>
        <div><dt>Role</dt><dd id="account-role"></dd></div>
      </dl>
    </article>
  </main>

  <footer class="site-footer">
    <p>AI Attendance Marker</p>
    <nav aria-label="Footer">
      <a href="/">Home</a>
      <a href="/login" data-guest>Sign in</a>
    </nav>
  </footer>
  <script src="/assets/app.js" defer></script>
</body>
</html>
