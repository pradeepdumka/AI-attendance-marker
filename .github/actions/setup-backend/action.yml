name: Set up backend
description: Install the Python libraries the API and its tests import.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libglib2.0-0 libgomp1

    # face-recognition depends on the source-only dlib package. dlib-bin is
    # the same library as a wheel, matching the Dockerfile install.
    - name: Install Python dependencies
      shell: bash
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install "dlib-bin==20.0.1.post1"
        pip install --no-deps "face-recognition==1.3.0"
        pip install "face-recognition-models>=0.3.0" "Pillow>=10"
        grep -vi '^face-recognition' requirements.txt > /tmp/requirements.ci.txt
        pip install -r /tmp/requirements.ci.txt
