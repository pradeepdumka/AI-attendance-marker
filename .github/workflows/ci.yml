name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: Compile the application
        working-directory: backend
        run: python -m compileall -q app

      - name: Verify runtime imports
        working-directory: backend
        run: |
          python -c "import builtins; builtins.quit = builtins.exit = lambda *a, **k: (_ for _ in ()).throw(SystemExit(1)); import face_recognition, cv2, dlib, fastapi; print('imports ok', cv2.__version__)"

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      JWT_SECRET: ci-test-secret-at-least-thirty-two-bytes-long
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: ai_attendance
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: Run tests
        run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ai-attendance-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start MySQL and the API
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          MYSQL_USER=root
          MYSQL_PASSWORD=ci-db-password
          MYSQL_DATABASE=ai_attendance
          JWT_SECRET=ci-test-secret-at-least-thirty-two-bytes-long
          ATTENDANCE_TIMEZONE=UTC
          EOF
          cat > docker-compose.ci.yml <<'EOF'
          services:
            api:
              image: ai-attendance-api:ci
          EOF
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Wait until the API is healthy
        run: |
          for _ in $(seq 1 36); do
            body="$(curl -fsS http://127.0.0.1:8000/health || true)"
            printf '%s\n' "$body"
            if printf '%s' "$body" | grep -q '"database":"connected"'; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Stop the stack
        if: ${{ !cancelled() }}
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Publish the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
