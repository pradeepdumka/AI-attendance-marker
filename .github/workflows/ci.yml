name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: Compile the application
        working-directory: backend
        run: python -m compileall -q app

      - name: Verify runtime imports
        working-directory: backend
        run: |
          python -c "import builtins; builtins.quit = builtins.exit = lambda *a, **k: (_ for _ in ()).throw(SystemExit(1)); import face_recognition, cv2, dlib, fastapi; print('imports ok', cv2.__version__)"

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      JWT_SECRET: ci-test-secret-at-least-thirty-two-bytes-long
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: ai_attendance
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: Run tests
        run: pytest

docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: pradeepdumka/ai-attendance-marker:latest

deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.ec2.yaml
          target: ~/

      - name: Deploy latest images on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            sudo docker compose --env-file ~/.env -f ~/docker-compose.ec2.yaml pull
            sudo docker compose --env-file ~/.env -f ~/docker-compose.ec2.yaml up -d --remove-orphans --wait --wait-timeout 300
            sudo docker compose --env-file ~/.env -f ~/docker-compose.ec2.yaml ps
            sudo docker image prune -f