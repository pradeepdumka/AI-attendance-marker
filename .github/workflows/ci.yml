name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      JWT_SECRET: ci-test-secret-at-least-thirty-two-bytes-long
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: ai_attendance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libraries
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libgomp1

      # face-recognition depends on the source-only dlib package. dlib-bin is
      # the same library as a wheel, matching the Dockerfile install.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dlib-bin==20.0.1.post1"
          pip install --no-deps "face-recognition==1.3.0"
          pip install "face-recognition-models>=0.3.0" "Pillow>=10"
          grep -vi '^face-recognition' requirements.txt > /tmp/requirements.ci.txt
          pip install -r /tmp/requirements.ci.txt

      - name: Run tests
        run: pytest
